<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Size and Positioning</title>
    <style>
        .large { display: none; }
        .small { display: block; }

        /* Screens wider than 800px */
        @media only screen and (min-width: 801px) {
            .large { display: block; }
            .small { display: none; }
        }
    </style>
</head>
<body>
    <p class="large">I'm Large</p>
    <p class="small">I'm Small</p>
</body>
</html>
